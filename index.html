    <script>
      (function () {
        var video = document.getElementById("hero-video");
        var replayBtn = document.getElementById("video-replay-btn");
        var posterOverlay = document.getElementById("video-poster-overlay");

        if (!video || !replayBtn) return;

        function showReplay() {
          if (posterOverlay) posterOverlay.style.display = "block";
          replayBtn.style.display = "flex";
          replayBtn.setAttribute("aria-hidden", "false");
        }

        function hideReplay() {
          if (posterOverlay) posterOverlay.style.display = "none";
          replayBtn.style.display = "none";
          replayBtn.setAttribute("aria-hidden", "true");
        }

        video.addEventListener("ended", function () {
          showReplay();
        });

        video.addEventListener("play", function () {
          hideReplay();
        });

        // In case user pauses at end or seeks
        video.addEventListener("pause", function () {
          if (video.ended) showReplay();
        });

        replayBtn.addEventListener("click", function (e) {
          e.preventDefault();
          hideReplay();
          try {
            video.currentTime = 0;
            video.play();
          } catch (err) {
            /* ignore */
          }
        });
      })();
    </script>
